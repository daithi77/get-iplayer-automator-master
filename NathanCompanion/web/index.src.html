<title>Nathán Companion</title>
<meta name="description" content="Irish practice for Years 8 to 12: words, grammar and speaking questions in Ulster Irish.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
@font-face{font-family:'Marking Hand';src:url(data:font/otf;base64,__HAND__) format('opentype');font-weight:400;font-display:block}
:root{
  --ground:#F5F6F8; --surface:#FFFFFF; --ink:#172031; --muted:#5B6576; --faint:#8A93A3; --rule:#DDE2E9; --rule-strong:#172031;
  --pen:#C8102E; --pen-wash:#FCEEF0; --biro:#1D45B0; --biro-wash:#EEF2FC; --good:#1E7A5A;
  --btn:#172031; --btn-ink:#FFFFFF; --focus:#1D45B0;
  --r:10px;
  --f:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --hand:'Marking Hand', 'Bradley Hand', 'Segoe Print', cursive;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0F141C; --surface:#171E2A; --ink:#E7EBF1; --muted:#A1AABA; --faint:#77829A; --rule:#283245; --rule-strong:#E7EBF1;
    --pen:#FF6F6F; --pen-wash:#3A1D24; --biro:#93B2FF; --biro-wash:#1B2740; --good:#5CCB9E;
    --btn:#E7EBF1; --btn-ink:#0F141C; --focus:#93B2FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0F141C; --surface:#171E2A; --ink:#E7EBF1; --muted:#A1AABA; --faint:#77829A; --rule:#283245; --rule-strong:#E7EBF1;
  --pen:#FF6F6F; --pen-wash:#3A1D24; --biro:#93B2FF; --biro-wash:#1B2740; --good:#5CCB9E;
  --btn:#E7EBF1; --btn-ink:#0F141C; --focus:#93B2FF;
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-inline:16px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);display:flex;align-items:center;gap:8px;padding-block:14px 10px;border-bottom:1px solid var(--rule)}
.top h1{margin:0;font-size:20px;line-height:1.2;font-weight:700;flex:1;text-wrap:balance}
.top .sub{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:2px}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border:0;background:transparent;border-radius:var(--r);cursor:pointer;color:var(--ink)}
.iconbtn:hover{background:var(--surface)}
main{flex:1;padding-block:16px 110px;display:flex;flex-direction:column;gap:22px}
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav.bar button{height:60px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--muted);cursor:pointer}
nav.bar button[aria-current="page"]{color:var(--ink);font-weight:700}
nav.bar button[aria-current="page"] svg{stroke:var(--pen)}
.hidden-bar nav.bar{display:none}

.lede{font-size:17px;margin:0;max-width:34em}
.lede small{display:block;color:var(--muted);font-size:14px;margin-top:4px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:700}
.list{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:12px 14px;border:0;border-top:1px solid var(--rule);background:transparent;text-align:left;cursor:pointer}
.row:first-child{border-top:0}
button.row:hover{background:var(--ground)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:16px}
.row .t span{display:block;font-size:13.5px;color:var(--muted)}
.row .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;white-space:nowrap}
.row .chev{color:var(--faint)}
.row.dim .t b{color:var(--muted)}
.row[disabled]{cursor:default}
.meter{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;margin-top:6px;max-width:180px}
.meter i{display:block;height:100%;background:var(--ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:var(--r);border:1.5px solid var(--btn);background:var(--btn);color:var(--btn-ink);font-weight:700;font-size:16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.link{border:0;background:transparent;color:var(--muted);text-decoration:underline;padding:0 6px;font-weight:400}
.btn[disabled]{opacity:.45;cursor:default}
.btn.wide{width:100%}
.seg{display:flex;border:1.5px solid var(--rule-strong);border-radius:var(--r);overflow:hidden}
.seg button{flex:1;min-height:44px;border:0;border-left:1.5px solid var(--rule-strong);background:transparent;cursor:pointer;font-size:15px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);font-weight:700}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;color:var(--muted)}
.input{width:100%;min-height:52px;padding:10px 14px;border:1.5px solid var(--rule-strong);border-radius:var(--r);background:var(--surface);color:var(--biro);font-size:20px}
.input::placeholder{color:var(--faint)}
textarea.input{min-height:120px;resize:vertical;font-size:18px;line-height:1.5}
.input.wrong{text-decoration:line-through;text-decoration-color:var(--pen);text-decoration-thickness:2px;border-color:var(--pen)}
.input.right{border-color:var(--good)}

/* exercise */
.ex{display:flex;flex-direction:column;gap:18px}
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.progress .track{flex:1;height:4px;background:var(--rule);border-radius:2px;overflow:hidden}
.progress .track i{display:block;height:100%;background:var(--pen)}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:20px 18px;display:flex;flex-direction:column;gap:16px}
.prompt{font-size:28px;line-height:1.2;font-weight:700;text-wrap:balance;margin:0}
.prompt.ga{color:var(--ink)}
.tag{font-size:13px;color:var(--muted)}
.answerwrap{position:relative;padding-top:22px}
.mark{font-family:var(--hand);color:var(--pen);font-size:26px;line-height:1;position:absolute;top:-4px;left:10px;white-space:nowrap;transform:rotate(-2deg);pointer-events:none}
.tick{font-family:var(--hand);color:var(--pen);font-size:30px;line-height:1}
.pen{font-family:var(--hand);color:var(--pen)}
.fadas{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.fadas button{min-height:46px;border:1.5px solid var(--rule-strong);border-radius:8px;background:var(--surface);font-size:22px;cursor:pointer}
.actions{display:flex;justify-content:space-between;align-items:center;gap:12px}
.entry{border-top:1px solid var(--rule);padding-top:12px;font-size:15px;color:var(--muted)}
.entry b{color:var(--ink);font-size:17px}
.choices{display:grid;gap:8px}
.choice{min-height:52px;padding:10px 14px;text-align:left;border:1.5px solid var(--rule);border-radius:var(--r);background:var(--surface);cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.choice:hover{border-color:var(--rule-strong)}
.choice.picked{border-color:var(--rule-strong)}
.choice.is-right{border-color:var(--good)}
.choice.is-wrong{border-color:var(--pen);text-decoration:line-through;text-decoration-color:var(--pen)}
.sentence{font-size:21px;line-height:1.9}
.sentence .blank{display:inline-block;min-width:7ch;vertical-align:baseline}
.sentence input{font-size:20px;min-height:44px;width:9ch;padding:4px 8px;border:0;border-bottom:2px solid var(--rule-strong);border-radius:0;background:transparent;color:var(--biro)}
.sentence .hint{color:var(--muted);font-size:17px}
.rule{background:var(--pen-wash);border-left:3px solid var(--pen);border-radius:0 var(--r) var(--r) 0;padding:12px 14px;font-size:15px}
.rule .pen{font-size:24px;display:block;margin-bottom:4px}
.note{font-size:13px;color:var(--faint)}
.results li{display:flex;gap:12px;align-items:baseline;padding:10px 14px;border-top:1px solid var(--rule)}
.results li:first-child{border-top:0}
.results ul{list-style:none;margin:0;padding:0}
.results .tick{width:28px;flex:none;text-align:center}
.results .g{color:var(--biro);font-size:17px}
.results .e{color:var(--muted);font-size:14px}
.big-pen{font-family:var(--hand);color:var(--pen);font-size:40px;line-height:1.1;transform:rotate(-3deg);margin:4px 0 0 4px}

.q{font-size:24px;font-weight:700;line-height:1.3;margin:0;text-wrap:balance}
.gloss{color:var(--muted);font-size:15px}
.opener{display:inline-block;font-size:15px;color:var(--muted);border:1px dashed var(--rule-strong);border-radius:8px;padding:6px 10px}
.saved{font-size:13px;color:var(--faint);min-height:18px}
details{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:0 14px}
details summary{cursor:pointer;min-height:48px;display:flex;align-items:center;font-weight:700;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:'+';margin-left:auto;color:var(--muted);font-weight:400;font-size:20px}
details[open] summary::after{content:'–'}
details .body{padding-bottom:14px;display:flex;flex-direction:column;gap:10px}
table.para{border-collapse:collapse;width:100%;font-size:15px}
table.para td{padding:6px 0;border-top:1px solid var(--rule);vertical-align:top}
.search{position:sticky;top:calc(env(safe-area-inset-top,0px) + 69px);z-index:4;background:var(--ground);padding-block:4px 8px}
.word b{font-size:17px}
.word i{color:var(--muted);font-style:italic;font-size:14px}
.empty{color:var(--muted);text-align:center;padding:28px 0}
.welcome{display:flex;flex-direction:column;gap:22px;padding-block:24px}
.welcome h2{font-size:30px;line-height:1.15;margin:0;text-wrap:balance}
.years{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.years button{min-height:56px;border:1.5px solid var(--rule-strong);border-radius:var(--r);background:var(--surface);font-size:20px;font-weight:700;cursor:pointer}
.years button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--rule);color:var(--muted)}
.teacher{font-size:13px;color:var(--muted);border-top:1px dashed var(--rule);padding-top:8px}
.teacher b{color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.prompt{font-size:24px}.sentence{font-size:19px}}
</style>

<div class="app" id="app">
  <header class="top">
    <button class="iconbtn" id="back" aria-label="Siar" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <h1 id="title">Gaeilge<span class="sub" id="subtitle"></span></h1>
    <button class="iconbtn" id="settingsBtn" aria-label="Socruithe">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>

<nav class="bar" aria-label="Príomhroghchlár">
  <div class="in">
    <button data-tab="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Baile</button>
    <button data-tab="words"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10h10M7 14h6"/></svg>Focail</button>
    <button data-tab="grammar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M6 16l6-12 6 12M8.5 11h7"/></svg>Gramadach</button>
    <button data-tab="questions"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Ceisteanna</button>

  </div>
</nav>

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const DAY=86400000;
const INTERVALS=[0,1,2,4,8,16,32];
const fold=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').normalize('NFC');
function norm(s){return String(s||'').toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ').trim().replace(/[.!?,;:]+$/,'').trim();}
function variants(ga){
  const out=new Set();
  String(ga||'').split(/[,/]/).map(x=>x.trim()).filter(Boolean).forEach(p=>{
    out.add(p.replace(/\s*\([^)]*\)\s*/g,' ').replace(/\s+/g,' ').trim());
    out.add(p.replace(/[()]/g,'').replace(/\s+/g,' ').trim());
  });
  return [...out].filter(Boolean);
}
/* ---------- tháite: present and future, first person plural only ---------- */
const IRREG=[['tá muid','táimid'],['níl muid','nílimid'],['bhfuil muid','bhfuilimid'],['bíonn muid','bímid'],['mbíonn muid','mbímid'],['beidh muid','beimid'],['mbeidh muid','mbeimid'],
 ['deir muid','deirimid'],['ndeir muid','ndeirimid'],['déarfaidh muid','déarfaimid'],['ndéarfaidh muid','ndéarfaimid'],['tchí muid','tchímid'],['feiceann muid','feicimid'],['bhfeiceann muid','bhfeicimid'],
 ['tchífidh muid','tchífimid'],['feicfidh muid','feicfimid'],['gheobhaidh muid','gheobhaimid'],['bhfaighidh muid','bhfaighimid'],['faigheann muid','faighimid'],['bhfaigheann muid','bhfaighimid'],
 ['rachaidh muid','rachaimid'],['téann muid','téimid'],['dtéann muid','dtéimid'],['déanann muid','déanaimid'],['ndéanann muid','ndéanaimid'],['déanfaidh muid','déanfaimid'],['ndéanfaidh muid','ndéanfaimid'],
 ['tagann muid','tagaimid'],['dtagann muid','dtagaimid'],['tiocfaidh muid','tiocfaimid'],['dtiocfaidh muid','dtiocfaimid'],['itheann muid','ithimid'],['n-itheann muid','n-ithimid'],['íosfaidh muid','íosfaimid'],
 ['tugann muid','tugaimid'],['dtugann muid','dtugaimid'],['tabharfaidh muid','tabharfaimid'],['dtabharfaidh muid','dtabharfaimid'],['cluineann muid','cluinimid'],['gcluineann muid','gcluinimid'],
 ['cluinfidh muid','cluinfimid'],['gcluinfidh muid','gcluinfimid'],['beireann muid','beirimid'],['mbeireann muid','mbeirimid'],['béarfaidh muid','béarfaimid'],['mbéarfaidh muid','mbéarfaimid']];
const TRULES=[['(\\p{L}+?)aíonn muid','$1aímid'],['(\\p{L}+?)íonn muid','$1ímid'],['(\\p{L}+?)eann muid','$1imid'],['(\\p{L}+?)ann muid','$1aimid'],
 ['(\\p{L}+?)eoidh muid','$1eoimid'],['(\\p{L}+?)óidh muid','$1óimid'],['(\\p{L}+?)faidh muid','$1faimid'],['(\\p{L}+?)fidh muid','$1fimid']];
const W=(src)=>new RegExp('(?<![\\p{L}\'-])'+src+'(?![\\p{L}])','giu');
function taite(t){
  let out=String(t||'');
  for(const [a,s] of IRREG){ out=out.replace(W(a),m=>m[0]===m[0].toUpperCase()&&m[0]!==m[0].toLowerCase()?s[0].toUpperCase()+s.slice(1):s); }
  for(const [p,r] of TRULES){ out=out.replace(W(p),r); }
  return out;
}
const shown=t=>store.form==='taite'?taite(t):t;

function mark(answer,accepted,strict){
  const a=norm(answer);
  const acc=[];accepted.forEach(x=>{acc.push(x);const t=taite(x);if(t!==x)acc.push(t);});
  if(!a) return {v:'wrong',right:shown(accepted[0]||''),blank:true};
  for(const x of acc) if(norm(x)===a) return {v:'right'};
  for(const x of acc) if(fold(norm(x))===fold(a)) return strict?{v:'wrong',right:x,fada:true}:{v:'fada',right:x};
  return {v:'wrong',right:shown(accepted[0]||'')};
}

/* ---------- storage ---------- */
const KEY='nathan-companion.v1';
const DEF={name:'',year:null,form:'scartha',strict:false,size:5,vmode:'write',teacher:false,words:{},gram:{},answers:{},qs:{},lastDay:'',streak:0};
let store=Object.assign({},DEF);
try{const t=localStorage.getItem(KEY);if(t)store=Object.assign({},DEF,JSON.parse(t));}catch(e){}
let storageOK=true;
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){storageOK=false;}}
const stage=()=> (store.year||8)>=11?'gcse':'ks3';

/* ---------- data ---------- */
const D={vocab:[],questions:[],grammar:[]};
function vocabFor(){return D.vocab.filter(v=>v.stage===stage());}
function groups(){
  const m=new Map();
  vocabFor().forEach(v=>{const k=v.group;if(!m.has(k))m.set(k,{name:k,en:v.groupEn,items:[]});m.get(k).items.push(v);});
  return [...m.values()];
}
function questionsFor(){
  const y=store.year||8;
  return D.questions.filter(q=> y<=8? q.beginner : y<=10? (q.tier==='F') : true);
}
function sectionsFor(){return D.grammar;}

/* ---------- mutation engine, Ulster forms ---------- */
const VOW='aeiouáéíóú';
const f1=w=>w.charAt(0).toLowerCase(), f2=w=>w.charAt(1).toLowerCase();
const startsV=w=>VOW.includes(f1(w));
const lenite=w=>('bcdfgmpt'.includes(f1(w))&&f2(w)!=='h')?w[0]+'h'+w.slice(1):w;
const isLen=w=>'bcdfgmpt'.includes(f1(w))&&f2(w)==='h';
const hasEcl=w=>['mb','gc','nd','bhf','ng','bp','dt','n-'].some(p=>w.toLowerCase().startsWith(p));
const sT=w=>f1(w)==='s'&&(VOW.includes(f2(w))||'lnr'.includes(f2(w)));
function withArticle(w,g){
  if(g==='m') return [startsV(w)?'an t-'+w:'an '+w];
  if(startsV(w)) return ['an '+w];
  if(sT(w)) return ['an t'+w];
  if('bcfgmp'.includes(f1(w))) return ['an '+lenite(w)];
  return ['an '+w];
}
function withPrep(p,w,g){
  if(p==='sa'){ if(startsV(w)) return ['san '+w]; if(f1(w)==='f') return ['san '+lenite(w)]; }
  if(startsV(w)) return [p+' '+w];
  if(sT(w)) return g==='f'?[p+' t'+w]:[p+' '+w,p+' t'+w];
  if('bcfgmp'.includes(f1(w))) return [p+' '+lenite(w)];
  return [p+' '+w];
}
const PREPS=['ar an','leis an','ag an','as an','faoin','don','ón','chuig an','sa'];
function engineQ(){
  const nouns=D.vocab.filter(v=>v.stage==='ks3'&&v.type==='noun'&&(v.gender==='m'||v.gender==='f')&&!/[\s,/()]/.test(v.ga)&&!/pl/.test(v.pos||''));
  const n=nouns[Math.floor(Math.random()*nouns.length)];
  if(Math.random()<.45) return {n,kind:'art',a:'an',accept:withArticle(n.ga,n.gender)};
  let p=PREPS[Math.floor(Math.random()*PREPS.length)];
  if(p==='sa'&&(startsV(n.ga)||f1(n.ga)==='f')) p='ar an';
  return {n,kind:'prep',a:p,accept:withPrep(p,n.ga,n.gender)};
}
function engineRule(q){
  const w=q.n.ga,g=q.n.gender;
  if(q.kind==='art'){
    if(g==='f'){
      if(startsV(w)) return ['Ainmfhocal baininscneach a thosaíonn le guta: ní athraíonn sé (an oíche).','Feminine, starts with a vowel: no change.'];
      if(sT(w)) return ['Ainmfhocal baininscneach a thosaíonn le s: cuirtear t roimhe (an tseachtain).','Feminine, starts with s: add t.'];
      if('bcfgmp'.includes(f1(w))) return ['Ainmfhocal baininscneach: séimhiú i ndiaidh an ailt (an bhean).','Feminine: lenite after the article.'];
      return ['Baininscneach le d, t, l, n nó r: ní athraíonn sé (an deoch).','Feminine starting d, t, l, n or r: no change.'];
    }
    if(startsV(w)) return ['Firinscneach a thosaíonn le guta: t- roimhe (an t-am).','Masculine, starts with a vowel: add t-.'];
    return ['Firinscneach: ní athraíonn sé i ndiaidh an ailt (an fear).','Masculine: no change after the article.'];
  }
  if(startsV(w)) return ['Guta i ndiaidh réamhfhocail agus an ailt: ní athraíonn sé.','A vowel after preposition and article: no change.'];
  if(sT(w)) return ['s roimh ghuta, l, n, r: t roimhe (ar an tsráid). Leis an fhirinscneach, glactar leis an dá fhoirm.','s before a vowel, l, n or r takes t. With masculine nouns, both forms are accepted.'];
  if('bcfgmp'.includes(f1(w))) return ['I nGaeilge Uladh cuirtear séimhiú i ndiaidh réamhfhocail agus an ailt: ar an bhord, sa charr.','Ulster Irish lenites after a preposition and the article.'];
  return ['Ní athraíonn d ná t i ndiaidh réamhfhocail agus an ailt: ar an doras.','d and t do not change after a preposition and the article.'];
}
function diagnose(ans,exp){
  const w=(ans.trim().split(/\s+/).pop()||''); const e=(exp.split(/\s+/).pop()||'');
  if(hasEcl(w)&&!hasEcl(e)) return 'urú, ní séimhiú!';
  if(isLen(e)&&!isLen(w)) return 'séimhiú de dhíth';
  if(!isLen(e)&&isLen(w)) return 'gan séimhiú anseo';
  if(/^t-/i.test(e)&&!/^t-/i.test(w)) return 't- de dhíth';
  if(/^ts/i.test(e)&&!/^ts/i.test(w)) return 't roimh s';
  return 'féach an riail';
}

function bump(bucket,id,right){
  const s=store[bucket][id]||{box:0,due:0,seen:0,right:0};

  s.due=Date.now()+INTERVALS[s.box]*DAY - (s.box?3600000:0);
  store[bucket][id]=s;
}

}

/* ---------- sessions ---------- */
function planVocab(scope,title){
  const now=Date.now(), st=id=>store.words[id];
  const due=scope.filter(v=>st(v.id)&&st(v.id).due<=now).sort((a,b)=>st(a.id).box-st(b.id).box);
  const fresh=shuffle(scope.filter(v=>!st(v.id)));
  let pool=[...due,...fresh];
  if(pool.length<store.size){pool=pool.concat(scope.filter(v=>st(v.id)&&st(v.id).due>now).sort((a,b)=>st(a.id).box-st(b.id).box));}
  const planned=shuffle(pool.slice(0,store.size));
  sess={kind:'vocab',mode:store.vmode,title,scope,planned,queue:planned.slice(),i:0,first:{},r:null,in0:'',in1:'',revealed:false,picked:null,opts:null};
  go('vocabRun');
}
function planGram(s){
  const keyed=s.items.map((it,i)=>({...it,key:s.id+'#'+i}));
  const now=Date.now(), st=k=>store.gram[k];
  const auto=keyed.filter(x=>x.kind!=='self'), self=keyed.filter(x=>x.kind==='self');
  const order=arr=>{const due=arr.filter(x=>st(x.key)&&st(x.key).due<=now), fresh=shuffle(arr.filter(x=>!st(x.key))), rest=arr.filter(x=>st(x.key)&&st(x.key).due>now);return [...due,...fresh,...rest];};
  const nSelf=Math.min(self.length,Math.round(store.size*0.2)); const picks=[...order(auto).slice(0,store.size-nSelf),...order(self).slice(0,nSelf)];
  const planned=shuffle(picks.length?picks:order(self).slice(0,store.size));
  sess={kind:'gram',title:s.title,sid:s.id,planned,queue:planned.slice(),i:0,first:{},r:null,in0:'',shownAns:false,selfDone:false};
  go('gramRun');
}
function planEngine(){
  const planned=[];const seen=new Set();let guard=0;
  while(planned.length<store.size&&guard++<200){const q=engineQ();const k=q.a+q.n.ga;if(seen.has(k))continue;seen.add(k);q.key='eng:'+k;planned.push(q);}
  sess={kind:'engine',title:'An t-alt agus réamhfhocail',planned,queue:planned.slice(),i:0,first:{},r:null,in0:''};
  go('engineRun');
}
function planQRun(){
  const withAns=questionsFor().filter(q=>(store.answers[q.id]||'').trim());
  const now=Date.now(); const st=id=>store.qs[id]||{box:0,due:0};
  const due=withAns.filter(q=>st(q.id).due<=now).sort((a,b)=>st(a.id).box-st(b.id).box);
  const rest=withAns.filter(q=>st(q.id).due>now).sort((a,b)=>st(a.id).due-st(b.id).due);
  const planned=[...due,...rest].slice(0,Math.min(store.size,withAns.length));
  if(!planned.length) return;
  sess={kind:'q',title:'Ó chuimhne',planned,queue:planned.slice(),i:0,first:{},r:null,in0:'',selfDone:false};
  go('qRun');
}
function record(id,ok){ if(sess.first[id]===undefined){sess.first[id]=ok; if(!ok) sess.queue.push(sess.queue[sess.i]);} }
function finish(){
  dayTick();
  if(sess.kind==='vocab'){sess.planned.forEach(v=>bump('words',v.id,!!sess.first[v.id]));sess.result=sess.planned.map(v=>({ok:!!sess.first[v.id],ga:v.ga+(v.prep?' '+v.prep:''),en:v.en}));}
  if(sess.kind==='gram'){sess.planned.forEach(x=>bump('gram',x.key,!!sess.first[x.key]));sess.result=sess.planned.map(x=>({ok:!!sess.first[x.key],ga:shown(x.kind==='fill'?x.full:x.answer),en:x.point}));}
  if(sess.kind==='engine'){sess.result=sess.planned.map(q=>({ok:!!sess.first[q.key],ga:q.accept[0],en:q.n.en}));}
  if(sess.kind==='q'){sess.planned.forEach(q=>bump('qs',q.id,!!sess.first[q.id]));sess.result=sess.planned.map(q=>({ok:!!sess.first[q.id],ga:q.ga,en:store.answers[q.id]}));}
  save(); go('results',{},{replace:true});
}
function nextItem(){
  sess.i++; sess.r=null; sess.in0=''; sess.in1=''; sess.revealed=false; sess.picked=null; sess.opts=null; sess.shownAns=false; sess.selfDone=false;
  if(sess.i>=sess.queue.length) return finish();
  render();
}
const curId=()=>{const x=sess.queue[sess.i];return sess.kind==='vocab'||sess.kind==='q'?x.id:x.key;};

const ACT={
  pickYear:(el)=>{window._wy=+el.dataset.y;document.querySelectorAll('.years button').forEach(b=>b.setAttribute('aria-pressed',b===el));},
  welcomeGo:()=>{const y=window._wy||store.year;if(!y){const g=document.querySelector('.years');g.style.outline='2px solid var(--pen)';return;}store.year=y;store.name=($('#wName').value||'').trim();save();hist.length=0;route={name:'home',params:{}};render();},
  startWordsAll:()=>planVocab(vocabFor(),'Gach topaic'),
  vmode:(el)=>{store.vmode=el.dataset.m;save();render();},
  openGroup:(el)=>go('group',{i:+el.dataset.i}),
  startGroup:(el)=>{const g=groups()[+el.dataset.i];planVocab(g.items,g.name);},
  reveal:()=>{sess.revealed=true;render();},
  checkWord:()=>{
    const v=sess.queue[sess.i];
    sess.in0=($('#a0')||{}).value||''; sess.in1=($('#a1')||{}).value||'';
    const first=v.prep?v.ga+' '+v.prep:v.ga;
    const r0=mark(sess.in0,variants(first).concat(v.prep?variants(v.ga):[]),store.strict);
    const r=[r0]; if(v.vn){const acc=variants(v.vn);if(v.prep)acc.push(v.vn+' '+v.prep);r.push(mark(sess.in1,acc,store.strict));}
    sess.r=r; record(v.id,r.every(x=>x.v!=='wrong')&&!sess.revealed); render();
  },
  pick:(el)=>{const v=sess.queue[sess.i];sess.picked=+el.dataset.i;record(v.id,sess.opts[sess.picked]===v.en);render();},
  next:()=>nextItem(),
  done:()=>{sess=null;hist.length=0;go(TAB[(hist[hist.length-1]||{}).name]||'home',{},{replace:true});},
  again:()=>{const s=sess; if(s.kind==='vocab') planVocab(s.scope,s.title); else if(s.kind==='gram') planGram(D.grammar.find(x=>x.id===s.sid)); else if(s.kind==='engine') planEngine(); else planQRun();},
  openSection:(el)=>go('section',{id:el.dataset.id}),
  startGram:(el)=>{const s=D.grammar.find(x=>x.id===el.dataset.id);if(s)planGram(s);},
  checkGram:()=>{
    const it=sess.queue[sess.i]; sess.in0=($('#a0')||{}).value||'';
    const acc=it.kind==='fill'?variants(it.answer).concat([it.answer]):[it.answer];
    sess.r=mark(sess.in0,acc,store.strict); record(it.key,sess.r.v!=='wrong'); render();
  },
  showAns:()=>{sess.in0=($('#a0')||{}).value||'';sess.shownAns=true;render();},
  selfMark:(el)=>{const it=sess.queue[sess.i];record(it.key,el.dataset.ok==='1');sess.selfDone=true;render();},
  startEngine:()=>planEngine(),
  checkEngine:()=>{const q=sess.queue[sess.i];sess.in0=($('#a0')||{}).value||'';sess.r=mark(sess.in0,q.accept,store.strict);record(q.key,sess.r.v!=='wrong');render();},
  openPage:(el)=>go('page',{i:+el.dataset.i}),
  openQ:(el)=>go('question',{id:el.dataset.id},{replace:el.dataset.replace==='1'}),
  startQRun:()=>planQRun(),
  checkQ:()=>{sess.in0=($('#a0')||{}).value||'';sess.r=true;render();},
  qMark:(el)=>{const q=sess.queue[sess.i];record(q.id,el.dataset.ok==='1');sess.selfDone=true;render();},
  dw:(el)=>{route.params.w=el.dataset.w;render();},
  setYear:(el)=>{store.year=+el.dataset.y;save();render();},
  setForm:(el)=>{store.form=el.dataset.f;save();render();},
  setSize:(el)=>{store.size=+el.dataset.n;save();render();},
  setStrict:(el)=>{store.strict=el.dataset.s==='1';save();render();},
  setTeacher:(el)=>{store.teacher=el.dataset.t==='1';save();render();},
  about:()=>go('about'),
  askClear:()=>{$('#clearBox').innerHTML='<span>Glan gach rud? · clear everything?</span><button class="btn ghost" data-act="cancelClear">Cealaigh</button><button class="btn" data-act="doClear" style="background:var(--pen);border-color:var(--pen);color:#fff">Glan</button>';},
  cancelClear:()=>render(),
  doClear:()=>{store.words={};store.gram={};store.answers={};store.qs={};store.streak=0;store.lastDay='';save();render();},
  back:()=>back(),
};
document.addEventListener('click',e=>{
  const fb=e.target.closest('[data-fada]');
  if(fb){const inp=lastInput&&document.body.contains(lastInput)&&!lastInput.readOnly?lastInput:document.querySelector('#view input:not([readonly]),#view textarea:not([readonly])');
    if(inp){const s=inp.selectionStart??inp.value.length,en=inp.selectionEnd??inp.value.length;inp.value=inp.value.slice(0,s)+fb.dataset.fada+inp.value.slice(en);inp.focus();try{inp.setSelectionRange(s+1,s+1);}catch(_){ }inp.dispatchEvent(new Event('input',{bubbles:true}));}
    return;}
  const tab=e.target.closest('nav.bar [data-tab]'); if(tab){hist.length=0;sess=null;route={name:tab.dataset.tab,params:{}};render();window.scrollTo(0,0);return;}
  const a=e.target.closest('[data-act]'); if(a&&ACT[a.dataset.act]&&!a.disabled){ACT[a.dataset.act](a,e);}
});
$('#back').addEventListener('click',()=>back());
$('#settingsBtn').addEventListener('click',()=>go('settings'));

/* ---------- boot ---------- */
Promise.all(['data/vocab.json','data/questions.json','data/grammar.json'].map(u=>fetch(u).then(r=>{if(!r.ok)throw new Error(u);return r.json();})))
  .then(([v,q,g])=>{D.vocab=v;D.questions=q;D.grammar=g;window.__app={D,store:()=>store,taite};render();})
  .catch(err=>{$('#view').innerHTML='<p class="empty">Níor lódáladh na sonraí. Could not load the data: '+esc(err.message)+'. Reload the page.</p>';});
})();
</script>
